function txt(s,X,Y,{size=30,f='SG',cor=BR,al='left',alpha=1,placa=false}={}){x.font=`${size}px ${f}`;if(placa){const w=x.measureText(s).width,L=al==='center'?X-w/2:al==='right'?X-w:X;x.fillStyle='rgba(19,16,48,.88)';x.beginPath();x.roundRect(L-8,Y-size*.82,w+16,size*1.05,6);x.fill();}

 if(stroke){x.setLineDash(dash||[]);x.strokeStyle=stroke;x.lineWidth=w;x.strokeRect(A[0],A[1],B[0]-A[0],B[1]-A[1]);x.setLineDash([]);}}
function seta(a,b,cor,w=5,head=20){const A=P(...a),B=P(...b),dx=B[0]-A[0],dy=B[1]-A[1],L=Math.hypot(dx,dy);if(L<3)return;

 x.lineCap='round';x.beginPath();x.moveTo(...A);x.lineTo(bx+ux,by+uy);x.strokeStyle=cor;x.lineWidth=w;x.stroke();
 x.beginPath();x.moveTo(...B);x.lineTo(bx-uy*hw,by+ux*hw);x.lineTo(bx+uy*hw,by-ux*hw);x.closePath();x.fillStyle=cor;x.fill();}

// ---------- solda e dois metais ----------
const g=a=>1+.42*Math.sin(1.7*a-.4);
function faixa(a,b,am=60){let mn=9,mx=-9;for(let s=0;s<=am;s++){const v=g(a+(b-a)*s/am);mn=Math.min(mn,v);mx=Math.max(mx,v);}return [mn,mx];}
function metais(n,{verm=true,alphaV=.6,linhasGrade=true}={}){const h=2/n;for(let i=0;i<n;i++){const a=i*h,b=a+h,[mn,mx]=faixa(a,b);for(let j=0;j<n;j++){const c=j*h,d=c+h,leve=c<=mx,pes=d>mn;

function solda(cor=BR,w=4){const c=[];for(let s=0;s<=80;s++){const a=2*s/80;c.push([a,g(a)]);}linha(c,cor,w);}
function cobertura(n,{cor=MEN,fill=.22,w=2,eng=0,dash=null}={}){const h=2/n;let area=0;for(let i=0;i<n;i++){const a=i*h,b=a+h,[mn,mx]=faixa(a,b);area+=(b-a)*(mx-mn);
  ret(a-eng,b+eng,mn-eng,mx+eng,fill?(cor===MEN?`rgba(140,255,210,${fill})`:mix(BG,cor,fill)):null,cor,w,dash);}return area;}
// ---------- quarto de disco ----------
function escadaB(n,{cIn=mix(BG,CI,.55),cBord=mix(BG,AL,.55),bordaOn=false}={}){const h=2/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){const near=(i*h)**2+(j*h)**2,far=((i+1)*h)**2+((j+1)*h)**2,cx=(i+.5)*h,cy=(j+.5)*h;
 const A=P(i*h,(j+1)*h),B=P((i+1)*h,j*h);let c=null;if(bordaOn&&near<4&&far>4)c=cBord;else if(cx*cx+cy*cy<=4)c=cIn;if(c){x.fillStyle=c;x.fillRect(A[0],A[1],B[0]-A[0]+.6,B[1]-A[1]+.6);}}}
function arcoB(cor=CI,w=3,r=2){const a=[];for(let k=0;k<=90;k++){const t=PI/2*k/90;a.push([r*Math.cos(t),r*Math.sin(t)]);}linha(a,cor,w);}

 for(const t of ticks){x.beginPath();x.moveTo(X0+t*k,Y-7);x.lineTo(X0+t*k,Y+7);x.stroke();txt(String(t),X0+t*k,Y+38,{size:24,f:'SGM',cor:GEO,al:'center'});}

 if(band){const [a,b]=band;x.fillStyle='rgba(184,196,218,.22)';x.fillRect(X0+a*k,Y-13,(b-a)*k,26);x.fillStyle=AZC;x.fillRect(X0+a*k-3,Y-18,6,36);x.fillStyle=CORAL;x.fillRect(X0+b*k-3,Y-18,6,36);}
