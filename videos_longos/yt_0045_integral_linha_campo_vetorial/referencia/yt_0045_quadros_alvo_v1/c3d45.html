// Cenas 3D-alvo do 3.6-T1 (Cálculo III · integral de linha de campo vetorial) · yt_0045 provisório, three.js r128. ?k=<chave>
// Reaproveita os helpers do c3d44 (lata em traço, eixoZ, piso). Cenas usadas no 3.6-T1: helice (H1), heliceCampo (B7-1, B7-2), heliceLeitura (B7-3).
// Estilo da série: opaco (MeshBasicMaterial), tom por face fixo (LDIR), sem sombra/névoa/brilho/transparência, fundo transparente.

// Mundo: z para cima; 1 unidade = SC unidades three. Pontos de tela (px, 1920×1080) dos rótulos em window.PTS.
// Chaves: lata, lata0, grade, superf, ponto, caixa, latagrade, caixinha, cilindro, cilindroRot, deslocado, deslocadoSonda, giro
const T=THREE,PI=Math.PI,K=new URLSearchParams(location.search).get('k')||'bola';
const W=1920,H=1080,R=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0x000000,0);document.body.appendChild(R.domElement);
const S=new T.Scene();T.Object3D.DefaultUp.set(0,0,1);
const cam=new T.PerspectiveCamera(22,W/H,.05,200);cam.up.set(0,0,1);
const BG='#131030',CI='#35D9FF',E1='#FFC24D',E2='#EA63FF',EZ='#5AA2FF',GEO='#B8C4DA',BR='#F5F7FF',RO='#FF9440',TH='#2EE6A6',FI='#B48CFF',SOMB='#FFC08A',LI='#C6F26B',
 AZC='#7FB2FF',CORAL='#FF7A8A',TR='#6C7698',AL='#FF5D5D',RAMP0='#10243A';
const C=h=>new T.Color(h), mixc=(a,b,t)=>C(a).lerp(C(b),t);

function ver(p,t,cx=600,cy=540){p=p.map((v,i)=>t[i]+(v-t[i])*DF);cam.position.set(...p);cam.lookAt(...t);cam.setViewOffset(W,H,960-cx,540-cy,W,H);cam.updateProjectionMatrix();cam.updateMatrixWorld(true);}
const PEND=[];function proj(nome,v){PEND.push([nome,v.slice()]);}
function projAll(){for(const [nome,v] of PEND){const q=new T.Vector3(...v).project(cam);PTS[nome]=[+((q.x+1)/2*W).toFixed(1),+((1-q.y)/2*H).toFixed(1)];}}
const Wp=(X,Y,Z)=>[SC*X,SC*Y,SC*Z];
const sph=(r,f,t)=>[r*Math.sin(f)*Math.cos(t),r*Math.sin(f)*Math.sin(t),r*Math.cos(f)];
const WS=(r,f,t)=>Wp(...sph(r,f,t));
function poli(pts){const cp=new T.CurvePath();for(let i=0;i+1<pts.length;i++)cp.add(new T.LineCurve3(new T.Vector3(...pts[i]),new T.Vector3(...pts[i+1])));return cp;}
const tubo=(pts,r,cor)=>{const m=new T.Mesh(new T.TubeGeometry(poli(pts),Math.max(8,(pts.length-1)*3),r,8,false),new T.MeshBasicMaterial({color:C(cor)}));S.add(m);return m;};
function tracejado(pts,r,cor,on=.12,off=.09){let acc=0,cur=[pts[0]],ligado=true;const segs=[];
 for(let i=1;i<pts.length;i++){const a=new T.Vector3(...pts[i-1]),b=new T.Vector3(...pts[i]);let L=a.distanceTo(b),pos=0;
  while(pos<L){const lim=(ligado?on:off)-acc,step=Math.min(lim,L-pos);pos+=step;acc+=step;const p=a.clone().lerp(b,pos/L);
   if(ligado)cur.push([p.x,p.y,p.z]);if(acc>=(ligado?on:off)-1e-9){if(ligado&&cur.length>1)segs.push(cur);ligado=!ligado;acc=0;cur=[[p.x,p.y,p.z]];}}}
 if(ligado&&cur.length>1)segs.push(cur);for(const s of segs)tubo(s,r,cor);}
function seta(a,b,r,cor){const A=new T.Vector3(...a),B=new T.Vector3(...b),d=B.clone().sub(A),L=d.length(),hl=Math.min(.18,.3*L),g=new T.Group(),m=new T.MeshBasicMaterial({color:C(cor)});
 const s=new T.Mesh(new T.CylinderGeometry(r,r,L-hl,12),m);s.position.y=(L-hl)/2;const c=new T.Mesh(new T.ConeGeometry(r*3,hl,18),m);c.position.y=L-hl/2;g.add(s,c);
 g.position.copy(A);g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());S.add(g);return g;}
function malhaTri(tris){const pos=[],col=[];for(const [a,b,c,cc] of tris){for(const p of [a,b,c]){pos.push(...p);col.push(cc.r,cc.g,cc.b);}}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));
 const m=new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));S.add(m);return m;}
// superfície paramétrica (a,b) -> ponto no mundo (já em unidades de SC); cor(a,b) -> THREE.Color
function sup(F,a0,a1,b0,b1,na,nb,cor){const tris=[];for(let i=0;i<na;i++)for(let j=0;j<nb;j++){const a=a0+(a1-a0)*i/na,b=a0+(a1-a0)*(i+1)/na,c=b0+(b1-b0)*j/nb,d=b0+(b1-b0)*(j+1)/nb;
 const cc=typeof cor==='function'?cor((a+b)/2,(c+d)/2):C(cor);tris.push([F(a,c),F(b,c),F(b,d),cc],[F(a,c),F(b,d),F(a,d),cc]);}return malhaTri(tris);}

// caixa [x0,x1]×[y0,y1]×[z0,z1] com cor por face (opaca)
function caixa(x0,x1,y0,y1,z0,z1,corF){const F=[[n=>Wp(x1,n[0],n[1]),[y0,y1,z0,z1],[1,0,0]],[n=>Wp(x0,n[0],n[1]),[y0,y1,z0,z1],[-1,0,0]],[n=>Wp(n[0],y0,n[1]),[x0,x1,z0,z1],[0,-1,0]],[n=>Wp(n[0],y1,n[1]),[x0,x1,z0,z1],[0,1,0]],[n=>Wp(n[0],n[1],z1),[x0,x1,y0,y1],[0,0,1]],[n=>Wp(n[0],n[1],z0),[x0,x1,y0,y1],[0,0,-1]]];
 for(const [f,[a0,a1,b0,b1],nn] of F)sup((a,b)=>f([a,b]),a0,a1,b0,b1,1,1,()=>corF(nn));}

// ---------- E1: cubo [0,1]³ com ρ = x + y + z ----------
if(K==='cubo'||K==='cuboCaixas'||K==='cuboSonda'||K==='cuboDiag'){SC=2.0;DF=1.4;
 if(K==='cuboCaixas'){const g=.035;for(const a of [0,.5])for(const b of [0,.5])for(const c of [0,.5]){const v=(a+b+c+.75)/3;caixa(a+g,a+.5-g,b+g,b+.5-g,c+g,c+.5-g,nn=>tom(corDens(v).getStyle?'#000':'#000',nn));}

 else{const fc=(p,nn)=>{const c=corRho3(p,3);return mixc(BG,'#'+c.getHexString(),.80+.20*Math.max(0,new T.Vector3(...nn).normalize().dot(LDIR)));};

 const fc=(p,k)=>mixc(BG,'#'+corDens(p[0]+p[1]).getHexString(),k);
 tri([0,0,0],[1,0,0],[0,1,0],p=>fc(p,.85));tri([0,0,0],[1,0,0],[0,0,1],p=>fc(p,.62));tri([0,0,0],[0,1,0],[0,0,1],p=>fc(p,.72));
