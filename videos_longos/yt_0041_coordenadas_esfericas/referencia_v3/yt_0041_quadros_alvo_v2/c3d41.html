<script>
// Cenas 3D-alvo do 3.5-T2 (Cálculo III · coordenadas esféricas na integral tripla), three.js r128. ?k=<chave>
// Estilo da série (c3d34t2/c3d38): opaco, sem luz (MeshBasicMaterial), tom por face fixo, sem sombra/névoa/brilho/transparência, fundo transparente.
// Regra da série: a peça NUNCA se separa; o que fica "do lado de fora" do corte vira TRAÇO #6C7698.
// Mundo: z para cima; 1 unidade = SC unidades three. Os pontos de tela (px, 1920×1080) dos rótulos vão em window.PTS.
// Chaves:
//   bola      bola de raio 1 com densidade = distância (cor ciano por ρ), um gomo θ ∈ [−40°, 20°] aberto: as faces do corte mostram o degradê; o gomo em traço (H1, B5)
//   grade     a grade esférica: esfera ρ = 1 em traço, cone φ = π/4 (violeta fraco), página θ = −π/4 (verde-água fraco) e duas células lima: polo e equador (H1/H2, B1-3, B2-1)
//   ponto     P = (ρ, φ, θ) = (2, π/6, π/3) com u = 1,1: ρ laranja, φ violeta, sombra r pêssego, θ verde-água, triângulo em pé (B1-1, B1-2)
//   caixa     a caixa [0,1] × [0,π] × [0,2π] no espaço (ρ, φ, θ), com a mesma célula lima (B1-3, B3-1)
//   bolagrade a imagem da caixa: bola com a grade de ρ, φ, θ (meia esfera da frente aberta em traço), célula lima, bordas ruins em ALERTA (B1-3, B3-1)
//   caixinha  zoom da célula do equador: arestas Δρ (laranja), ρΔφ (violeta), ρ sen φ Δθ (verde-água) e o raio do paralelo ρ sen φ até o eixo z (B2-1)
//   cebola    cascas esféricas com um gomo aberto; a casca em ρ = 0,7 acende (B4)
//   casquinha cone φ = π/4 + calota da esfera ρ = 2 cos φ, gomo aberto; a reta-sonda em φ = π/6 entra na origem e sai na esfera (B6)
//   lata      cilindro r ≤ 1, 0 ≤ z ≤ 1 em traço com o cone φ = π/4 tracejado; duas sondas: φ = π/3 sai pela parede, φ = π/8 sai pela tampa (B7, S2)
const T=THREE,PI=Math.PI,K=new URLSearchParams(location.search).get('k')||'bola';
const W=1920,H=1080,R=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0x000000,0);document.body.appendChild(R.domElement);
const S=new T.Scene();T.Object3D.DefaultUp.set(0,0,1);
const cam=new T.PerspectiveCamera(22,W/H,.05,200);cam.up.set(0,0,1);
const BG='#131030',CI='#35D9FF',E1='#FFC24D',E2='#EA63FF',EZ='#5AA2FF',GEO='#B8C4DA',BR='#F5F7FF',RO='#FF9440',TH='#2EE6A6',FI='#B48CFF',SOMB='#FFC08A',LI='#C6F26B',
 AZC='#7FB2FF',CORAL='#FF7A8A',TR='#6C7698',AL='#FF5D5D',RAMP0='#10243A';
const C=h=>new T.Color(h), mixc=(a,b,t)=>C(a).lerp(C(b),t);
let SC=2;const PTS={};
let DF=1.4;
function ver(p,t,cx=600,cy=540){p=p.map((v,i)=>t[i]+(v-t[i])*DF);cam.position.set(...p);cam.lookAt(...t);cam.setViewOffset(W,H,960-cx,540-cy,W,H);cam.updateProjectionMatrix();cam.updateMatrixWorld(true);}
const PEND=[];function proj(nome,v){PEND.push([nome,v.slice()]);}
function projAll(){for(const [nome,v] of PEND){const q=new T.Vector3(...v).project(cam);PTS[nome]=[+((q.x+1)/2*W).toFixed(1),+((1-q.y)/2*H).toFixed(1)];}}
const Wp=(X,Y,Z)=>[SC*X,SC*Y,SC*Z];
const sph=(r,f,t)=>[r*Math.sin(f)*Math.cos(t),r*Math.sin(f)*Math.sin(t),r*Math.cos(f)];
const WS=(r,f,t)=>Wp(...sph(r,f,t));
function poli(pts){const cp=new T.CurvePath();for(let i=0;i+1<pts.length;i++)cp.add(new T.LineCurve3(new T.Vector3(...pts[i]),new T.Vector3(...pts[i+1])));return cp;}
const tubo=(pts,r,cor)=>{const m=new T.Mesh(new T.TubeGeometry(poli(pts),Math.max(8,(pts.length-1)*3),r,8,false),new T.MeshBasicMaterial({color:C(cor)}));S.add(m);return m;};
function tracejado(pts,r,cor,on=.12,off=.09){let acc=0,cur=[pts[0]],ligado=true;const segs=[];
 for(let i=1;i<pts.length;i++){const a=new T.Vector3(...pts[i-1]),b=new T.Vector3(...pts[i]);let L=a.distanceTo(b),pos=0;
  while(pos<L){const lim=(ligado?on:off)-acc,step=Math.min(lim,L-pos);pos+=step;acc+=step;const p=a.clone().lerp(b,pos/L);
   if(ligado)cur.push([p.x,p.y,p.z]);if(acc>=(ligado?on:off)-1e-9){if(ligado&&cur.length>1)segs.push(cur);ligado=!ligado;acc=0;cur=[[p.x,p.y,p.z]];}}}
 if(ligado&&cur.length>1)segs.push(cur);for(const s of segs)tubo(s,r,cor);}
function seta(a,b,r,cor){const A=new T.Vector3(...a),B=new T.Vector3(...b),d=B.clone().sub(A),L=d.length(),hl=Math.min(.18,.3*L),g=new T.Group(),m=new T.MeshBasicMaterial({color:C(cor)});
 const s=new T.Mesh(new T.CylinderGeometry(r,r,L-hl,12),m);s.position.y=(L-hl)/2;const c=new T.Mesh(new T.ConeGeometry(r*3,hl,18),m);c.position.y=L-hl/2;g.add(s,c);
 g.position.copy(A);g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());S.add(g);return g;}
function malhaTri(tris){const pos=[],col=[];for(const [a,b,c,cc] of tris){for(const p of [a,b,c]){pos.push(...p);col.push(cc.r,cc.g,cc.b);}}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));
 const m=new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));S.add(m);return m;}
// superfície paramétrica (a,b) -> ponto no mundo (já em unidades de SC); cor(a,b) -> THREE.Color
function sup(F,a0,a1,b0,b1,na,nb,cor){const tris=[];for(let i=0;i<na;i++)for(let j=0;j<nb;j++){const a=a0+(a1-a0)*i/na,b=a0+(a1-a0)*(i+1)/na,c=b0+(b1-b0)*j/nb,d=b0+(b1-b0)*(j+1)/nb;
 const cc=typeof cor==='function'?cor((a+b)/2,(c+d)/2):C(cor);tris.push([F(a,c),F(b,c),F(b,d),cc],[F(a,c),F(b,d),F(a,d),cc]);}return malhaTri(tris);}
const arco=(f,a0,a1,n=80)=>Array.from({length:n+1},(_,k)=>f(a0+(a1-a0)*k/n));
// tom por face (fixo, sem luz): direção "clara" L; a face mais de frente para L fica mais clara
const LDIR=new T.Vector3(.55,-.75,.45).normalize();
const tom=(cor,n,base=.50,amp=.32)=>mixc(BG,cor,base+amp*Math.max(0,new T.Vector3(...n).normalize().dot(LDIR)));
const corDens=r=>mixc(RAMP0,CI,Math.pow(Math.min(1,Math.max(0,r)),.85));
function eixos3(lx,ly,lz,{neg=0}={}){seta([-neg*SC,0,0],[lx,0,0],.012,E1);seta([0,-neg*SC,0],[0,ly,0],.012,E2);seta([0,0,-neg*SC],[0,0,lz],.012,EZ);
 proj('ex',[lx+.16,0,0]);proj('ey',[0,ly+.16,0]);proj('ez',[0,0,lz+.16]);}

// ---------- bola: densidade = distância, gomo aberto ----------
function bolaCortada(ta,tb,{dens=true,cor=CI,meridianos=12,tracoGomo=true}={}){
 // casca externa fora do gomo: tom por face sobre a cor de ρ = 1
 sup((f,t)=>WS(1,f,t),0,PI,tb,ta+2*PI,48,110,(f,t)=>tom(dens?corDens(1):C(cor),sph(1,f,t),.42,.42));
 // faces do corte (planos θ = ta e θ = tb): semidiscos coloridos por ρ
 for(const t of [ta,tb])sup((r,f)=>WS(r,f,t),0,1,0,PI,40,60,(r,f)=>dens?corDens(r):mixc(BG,cor,.5));
 // bordas vivas do corte
 for(const t of [ta,tb])tubo(arco(f=>WS(1,f,t),0,PI),.012,dens?CI:cor);
 tubo([Wp(0,0,-1),Wp(0,0,1)],.010,GEO);
 // o gomo removido em traço
 if(tracoGomo){for(let k=1;k<=3;k++){const t=ta+(tb-ta)*k/4;tubo(arco(f=>WS(1,f,t),0,PI),.006,TR);}
  for(const f of [PI/4,PI/2,3*PI/4])tubo(arco(t=>WS(1,f,t),ta,tb,30),.006,TR);}
}
const CAZ=Math.atan2(-6.2,9.2);
if(K==='bola'){SC=2;const ta=CAZ-PI/4,tb=CAZ+PI/4;
 bolaCortada(ta,tb);
 // casca de raio 0,5 e 0,85 desenhadas nas faces do corte (anéis de nível da densidade)
 for(const r of [.25,.5,.75])for(const t of [ta,tb])tubo(arco(f=>WS(r,f,t),0,PI,50),.005,'#1E5C7A');
 seta([SC*1.02,0,0],[SC*1.55,0,0],.012,E1);seta([0,SC*1.02,0],[0,SC*1.55,0],.012,E2);seta([0,0,SC*1.0],[0,0,SC*1.5],.012,EZ);
 proj('ex',[SC*1.68,0,0]);proj('ey',[0,SC*1.68,0]);proj('ez',[0,0,SC*1.62]);
 ver([9.2,-6.2,4.3],[0,0,0],600,560);
 proj('centro',[0,0,0]);proj('casca',WS(1,PI*.62,tb+.9).map(v=>v*1.02));proj('faceMeio',WS(.5,PI*.35,ta));proj('faceBorda',WS(.95,PI*.5,ta));proj('faceB',WS(.6,PI*.55,tb));
 proj('raio',WS(.55,PI/2,ta));proj('topo',[0,0,SC+.1]);}

// ---------- célula esférica (6 faces) ----------
function celula(r1,r2,f1,f2,t1,t2,cor=LI,{w=.010,borda=LI,fill=true}={}){
 if(fill){const fc=(n)=>tom(cor,n,.40,.45);
  sup((f,t)=>WS(r2,f,t),f1,f2,t1,t2,8,8,(f,t)=>fc(sph(1,f,t)));
  sup((f,t)=>WS(r1,f,t),f1,f2,t1,t2,8,8,(f,t)=>mixc(BG,cor,.30));
  for(const t of [t1,t2])sup((r,f)=>WS(r,f,t),r1,r2,f1,f2,4,8,(r,f)=>fc([-Math.sin(t)*(t===t1?1:-1),Math.cos(t)*(t===t1?1:-1),0].map(v=>-v)));
  for(const f of [f1,f2])if(Math.sin(f)>1e-6)sup((r,t)=>WS(r,f,t),r1,r2,t1,t2,4,8,(r,t)=>fc(f===f1?[-Math.cos(f)*Math.cos(t),-Math.cos(f)*Math.sin(t),Math.sin(f)]:[Math.cos(f)*Math.cos(t),Math.cos(f)*Math.sin(t),-Math.sin(f)]));}
 for(const r of [r1,r2])for(const f of [f1,f2])if(Math.sin(f)>1e-6)tubo(arco(t=>WS(r,f,t),t1,t2,20),w,borda);
 for(const r of [r1,r2])for(const t of [t1,t2])tubo(arco(f=>WS(r,f,t),f1,f2,20),w,borda);
 for(const f of [f1,f2])for(const t of [t1,t2])tubo([WS(r1,f,t),WS(r2,f,t)],w,borda);}
function esferaTraco(r,{nm=12,np=[PI/6,PI/3,PI/2,2*PI/3,5*PI/6],cor=TR,w=.005,t0=0,t1=2*PI}={}){
 for(let k=0;k<nm;k++){const t=2*PI*k/nm;if(t<t0-1e-9||t>t1+1e-9)continue;tubo(arco(f=>WS(r,f,t),0,PI,60),w,cor);}
 for(const f of np)tubo(arco(t=>WS(r,f,t),t0,t1,90),w,cor);}

if(K==='grade'||K==='superf'){SC=2.1;
 esferaTraco(1,{nm:12,np:[PI/6,PI/3,PI/2,2*PI/3,5*PI/6]});
 if(K==='superf'){
 // cone φ = π/4 (violeta fraco) até ρ = 1 e a página θ = −π/4 (verde-água fraco)
 sup((r,t)=>WS(r,PI/4,t),0,1,0,2*PI,6,72,(r,t)=>mixc(BG,FI,.28+.10*Math.max(0,Math.cos(t+1.0))));
 tubo(arco(t=>WS(1,PI/4,t),0,2*PI,96),.008,FI);
 sup((r,f)=>WS(r,f,-PI/4+2*PI),0,1,0,PI,6,40,()=>mixc(BG,TH,.26));
 tubo(arco(f=>WS(1,f,-PI/4),0,PI,60),.008,TH);
 sup((f,t)=>WS(.6,f,t),0,PI,PI*.05,PI*1.05,30,50,(f,t)=>tom(RO,sph(1,f,t),.40,.30));esferaTraco(.6,{nm:12,np:[PI/2],cor:'#7A5A44',t0:0,t1:2*PI});}
 // cascas internas da grade (traço)
 tubo([Wp(0,0,-1.25),Wp(0,0,1.35)],.008,EZ);
 if(K==='grade')esferaTraco(.5,{nm:12,np:[PI/2],cor:'#4A4F78'});
 // duas células lima: polo e equador (ρ ∈ [1/2, 1], Δφ = Δθ = π/6), na mesma fatia de θ
 const t1=-PI/2+.15,t2=t1+PI/6;
 if(K==='grade'){celula(.5,1,0,PI/6,t1,t2);celula(.5,1,PI/3,PI/2,t1,t2);}
 ver([9.0,-6.8,4.0],[0,0,.05],600,560);
 proj('celPolo',WS(1.04,PI/12,(t1+t2)/2));proj('celEq',WS(1.04,5*PI/12,(t1+t2)/2));proj('celPoloIn',WS(.75,PI/12,(t1+t2)/2));proj('celEqIn',WS(.75,5*PI/12,(t1+t2)/2));
 proj('cone',WS(.95,PI/4,PI*.85));proj('pagina',WS(.7,PI*.62,-PI/4));proj('esfera',WS(1,PI*.7,PI*.15));proj('ez',[0,0,SC*1.35+.15]);proj('centro',[0,0,0]);}

// ---------- ponto P ----------
if(K==='ponto'){SC=1.35;DF=1.3;const rho=2,f=PI/6,t=PI/3,Pp=sph(rho,f,t),r=rho*Math.sin(f),P1=[Pp[0],Pp[1],0];
 // chão com grade polar fraca
 for(const rr of [.5,1,1.5,2])tubo(arco(a=>Wp(rr*Math.cos(a),rr*Math.sin(a),0),0,2*PI,96),.0045,'#3A3470');
 for(let k=0;k<12;k++){const a=2*PI*k/12;tubo([Wp(0,0,0),Wp(2*Math.cos(a),2*Math.sin(a),0)],.0045,'#3A3470');}
 seta([0,0,0],[SC*2.45,0,0],.013,E1);seta([0,0,0],[0,SC*2.4,0],.013,E2);seta([0,0,0],[0,0,SC*2.35],.013,EZ);
 proj('ex',[SC*2.58,0,0]);proj('ey',[0,SC*2.53,0]);proj('ez',[0,0,SC*2.5]);
 // triângulo em pé na página θ: preenchido fraco
 sup((s,u)=>Wp(...[0,0,0].map((v,i)=>v+s*(Pp[i]*(1-u)+P1[i]*u))),0,1,0,1,4,4,()=>mixc(BG,TH,.16));
 tubo([Wp(0,0,0),Wp(...Pp)],.017,RO);                      // ρ
 tracejado([Wp(...Pp),Wp(...P1)],.010,EZ);                // altura z (vertical)
 tubo([Wp(0,0,0),Wp(...P1)],.014,SOMB);                   // sombra r
 tubo([Wp(0,0,0),Wp(0,0,rho*Math.cos(f))],.016,EZ);       // z no eixo
 tracejado([Wp(...Pp),Wp(0,0,rho*Math.cos(f))],.007,GEO);
 tubo(arco(a=>WS(.7,a,t),0,f,30),.012,FI);               // arco φ a partir do eixo z
 tubo(arco(a=>Wp(.75*Math.cos(a),.75*Math.sin(a),0),0,t,40),.012,TH); // arco θ no chão
 tracejado([Wp(...P1),Wp(Pp[0],0,0)],.006,E1,.08,.07);tracejado([Wp(...P1),Wp(0,Pp[1],0)],.006,E2,.08,.07);
 const bol=new T.Mesh(new T.SphereGeometry(.07,24,16),new T.MeshBasicMaterial({color:C(BR)}));bol.position.set(...Wp(...Pp));S.add(bol);
 const b1=new T.Mesh(new T.SphereGeometry(.05,20,12),new T.MeshBasicMaterial({color:C(SOMB)}));b1.position.set(...Wp(...P1));S.add(b1);
 ver([8.6,-5.4,4.4],[0,.6,.95],620,560);
 proj('P',Wp(...Pp));proj('P1',Wp(...P1));proj('meioRho',Wp(...Pp.map(v=>v*.5)));proj('meioR',Wp(P1[0]*.5,P1[1]*.5,0));proj('arcoFi',WS(.78,f*.5,t));
 proj('arcoTh',Wp(.85*Math.cos(t*.45),.85*Math.sin(t*.45),0));proj('meioZ',Wp(Pp[0],Pp[1],Pp[2]*.5));proj('zEixo',Wp(0,0,rho*Math.cos(f)));proj('O',[0,0,0]);
 proj('xP',Wp(Pp[0],0,0));proj('yP',Wp(0,Pp[1],0));}

// ---------- caixa (espaço ρ, φ, θ) ----------
if(K==='caixa'||K==='caixa2'){SC=1;DF=1.15;const A=2.2,B=2.2/PI,Cc=3.0/(2*PI);
 const Q=(r,f,t)=>[r*A,t*Cc,f*B];   // ρ → eixo x (laranja), θ → eixo y (verde-água), φ → eixo z (violeta, para cima)
 const meia=K==='caixa2';           // caixa2: a caixa partida em θ = π (B3-1): metade θ ≤ π azul-claro, θ ≥ π coral
 const face=(F,a0,a1,b0,b1,c)=>sup(F,a0,a1,b0,b1,2,2,()=>c);
 const cT=t=>meia?(t<PI?mixc(BG,AZC,.30):mixc(BG,CORAL,.26)):mixc(BG,GEO,.20);
 // faces visíveis: ρ = 1 (frente-direita), θ = 0 (frente-esquerda), φ = π (topo)
 if(meia){face((f,t)=>Q(1,f,t),0,PI,0,PI,cT(0));face((f,t)=>Q(1,f,t),0,PI,PI,2*PI,cT(4));face((r,t)=>Q(r,PI,t),0,1,0,PI,cT(0));face((r,t)=>Q(r,PI,t),0,1,PI,2*PI,cT(4));}
 else{face((f,t)=>Q(1,f,t),0,PI,0,2*PI,mixc(BG,GEO,.24));face((r,t)=>Q(r,PI,t),0,1,0,2*PI,mixc(BG,GEO,.30));}
 face((r,f)=>Q(r,f,0),0,1,0,PI,meia?mixc(BG,AZC,.36):mixc(BG,GEO,.18));
 const gl='#4A4F78';
 for(let i=1;i<4;i++){const r=i/4;tubo([Q(r,0,0),Q(r,PI,0)],.005,gl);tubo([Q(r,PI,0),Q(r,PI,2*PI)],.005,gl);}
 for(let i=1;i<6;i++){const f=PI*i/6;tubo([Q(0,f,0),Q(1,f,0)],.005,gl);tubo([Q(1,f,0),Q(1,f,2*PI)],.005,gl);}
 for(let i=1;i<12;i++){const t=2*PI*i/12;tubo([Q(1,0,t),Q(1,PI,t)],.005,gl);tubo([Q(0,PI,t),Q(1,PI,t)],.005,gl);}
 // arestas visíveis
 for(const p of [[[0,0,0],[1,0,0]],[[1,0,0],[1,PI,0]],[[1,PI,0],[0,PI,0]],[[1,0,0],[1,0,2*PI]],[[1,PI,0],[1,PI,2*PI]],[[1,0,2*PI],[1,PI,2*PI]],[[1,PI,2*PI],[0,PI,2*PI]]])tubo(p.map(q=>Q(...q)),.010,GEO);
 // bordas ruins: arestas da face ρ = 0 (ALERTA tracejado) e a face θ = 0 / θ = 2π (contorno coral)
 for(const p of [[[0,0,0],[0,PI,0]],[[0,PI,0],[0,PI,2*PI]],[[0,0,0],[0,0,2*PI]],[[0,0,2*PI],[0,PI,2*PI]]])tracejado(p.map(q=>Q(...q)),.012,AL,.10,.07);
 if(meia){tracejado([Q(0,PI,PI),Q(1,PI,PI),Q(1,0,PI)],.013,AL,.10,.07);}
 // a célula lima: ρ ∈ [1/2, 1], φ ∈ [π/3, π/2], θ ∈ [t1, t2] (a mesma da bola)
 const t1=3*PI/2+.15,t2=t1+PI/6,cl=[[.5,PI/3],[1,PI/3],[1,PI/2],[.5,PI/2]];
 if(!meia){sup((f,t)=>Q(1.004,f,t),PI/3,PI/2,t1,t2,1,1,()=>mixc(BG,LI,.80));
  tubo([Q(1,PI/3,t1),Q(1,PI/2,t1),Q(1,PI/2,t2),Q(1,PI/3,t2),Q(1,PI/3,t1)],.010,LI);
  for(const t of [t1,t2])tracejado([Q(1,PI/3,t),Q(.5,PI/3,t),Q(.5,PI/2,t)],.006,LI,.06,.05);tracejado([Q(.5,PI/3,t1),Q(.5,PI/3,t2)],.006,LI,.06,.05);}
