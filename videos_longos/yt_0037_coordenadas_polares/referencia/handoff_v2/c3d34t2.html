<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><title>c3d34t2</title>
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head><body>
<script src="three.min.js"></script>
<script>
// Cenas 3D-alvo do 3.4-T2 (Cálculo III · coordenadas polares na integral dupla), three.js r128. ?k=<chave>
// Estilo da série (c3d33/c3d35): opaco, sem luz, tom por face/altura, sem sombra/névoa/brilho/transparência, fundo transparente.
// Regra v3 da série: a peça NUNCA se separa; o que fica "do lado de fora" do corte vira TRAÇO #6C7698.
// Aqui o corte é um CILINDRO r = r0 (a "faca" das polares): a face do corte é a parede da casca, em laranja (cor de r).
// Chaves:
//   sino   z = e^(−(x²+y²)) sobre o disco unitário (H1): miolo r ≤ 0,55 opaco, parede da casca em r = 0,55 laranja, resto em traço; chão com grade polar
//   esfera esfera de raio 1 (B5): miolo r ≤ 0,5 opaco (tampas de cima e de baixo), parede da casca laranja (altura 2√(1 − r²)), resto em traço
//   gauss  z = e^(−(x²+y²)) sobre o quadrado [−R, R]² com R = 1,25 (B7); no chão o disco inscrito (azul-claro) e o circunscrito (coral)
const T=THREE,PI=Math.PI,K=new URLSearchParams(location.search).get('k')||'sino';
const W=1920,H=1080,R=new T.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.setClearColor(0x000000,0);document.body.appendChild(R.domElement);
const S=new T.Scene();T.Object3D.DefaultUp.set(0,0,1);
const cam=new T.PerspectiveCamera(22,W/H,.05,200);cam.up.set(0,0,1);
const BG='#131030',CI='#35D9FF',E1='#FFC24D',E2='#EA63FF',GEO='#B8C4DA',RAMP0='#10243A',BR='#F5F7FF',RR='#FF9440',TH='#2EE6A6',LI='#C6F26B',
 AZC='#7FB2FF',CORAL='#FF7A8A',TR='#6C7698';
const C=h=>new T.Color(h), mixc=(a,b,t)=>C(a).lerp(C(b),t);
let SC=2,ZS=1,VMAX=1;const PTS={};
function ver(p,t,cx=600,cy=540){cam.position.set(...p);cam.lookAt(...t);cam.setViewOffset(W,H,960-cx,540-cy,W,H);cam.updateProjectionMatrix();cam.updateMatrixWorld(true);}
function proj(nome,v){const q=new T.Vector3(...v).project(cam);PTS[nome]=[+((q.x+1)/2*W).toFixed(1),+((1-q.y)/2*H).toFixed(1)];}
function poli(pts){const cp=new T.CurvePath();for(let i=0;i+1<pts.length;i++)cp.add(new T.LineCurve3(new T.Vector3(...pts[i]),new T.Vector3(...pts[i+1])));return cp;}
const tubo=(pts,r,cor)=>{const m=new T.Mesh(new T.TubeGeometry(poli(pts),Math.max(8,(pts.length-1)*4),r,8,false),new T.MeshBasicMaterial({color:C(cor)}));S.add(m);return m;};
function seta(a,b,r,cor){const A=new T.Vector3(...a),B=new T.Vector3(...b),d=B.clone().sub(A),L=d.length(),hl=Math.min(.16,.3*L),g=new T.Group(),m=new T.MeshBasicMaterial({color:C(cor)});
 const s=new T.Mesh(new T.CylinderGeometry(r,r,L-hl,12),m);s.position.y=(L-hl)/2;const c=new T.Mesh(new T.ConeGeometry(r*3,hl,18),m);c.position.y=L-hl/2;g.add(s,c);
 g.position.copy(A);g.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize());S.add(g);return g;}
function malhaTri(tris){const pos=[],col=[];for(const [a,b,c,cc] of tris){for(const p of [a,b,c]){pos.push(...p);col.push(cc.r,cc.g,cc.b);}}
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(pos,3));g.setAttribute('color',new T.Float32BufferAttribute(col,3));
 const m=new T.Mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));S.add(m);return m;}
const corAlt=v=>mixc(RAMP0,CI,Math.pow(Math.min(1,Math.max(0,v)/VMAX),.85));
// superfície paramétrica em (a,b) -> [x, y, valor]; cor por altura (valor) ou cor fixa
function sup(F,a0,a1,b0,b1,na,nb,cor=null){const tris=[];const P=(a,b)=>{const q=F(a,b);return [SC*q[0],SC*q[1],SC*ZS*q[2]];};
 for(let i=0;i<na;i++)for(let j=0;j<nb;j++){const a=a0+(a1-a0)*i/na,b=a0+(a1-a0)*(i+1)/na,c=b0+(b1-b0)*j/nb,d=b0+(b1-b0)*(j+1)/nb;
  const v=F((a+b)/2,(c+d)/2)[2],cc=cor?(typeof cor==='function'?cor((a+b)/2,(c+d)/2):C(cor)):corAlt(Math.abs(v));tris.push([P(a,c),P(b,c),P(b,d),cc],[P(a,c),P(b,d),P(a,d),cc]);}
 return malhaTri(tris);}
const anel=(f,n=120)=>Array.from({length:n+1},(_,k)=>f(2*PI*k/n));
const W3=(X,Y,v)=>[SC*X,SC*Y,SC*ZS*v];
function chaoDisco(Rr,fill='#1C1846'){const m=new T.Mesh(new T.CircleGeometry(SC*Rr,128),new T.MeshBasicMaterial({color:C(fill)}));m.position.z=-.003;S.add(m);}
function gradePolar(Rr,nr,nt,cor='#3A3470'){for(let i=1;i<=nr;i++){const r=Rr*i/nr;tubo(anel(t=>W3(r*Math.cos(t),r*Math.sin(t),0)),.0045,cor);}
 for(let k=0;k<nt;k++){const t=2*PI*k/nt;tubo([W3(0,0,0),W3(Rr*Math.cos(t),Rr*Math.sin(t),0)],.0045,cor);}}
function eixos(lx,ly,lz,z0=0){seta([0,0,.012],[lx,0,.012],.011,E1);seta([0,0,.012],[0,ly,.012],.011,E2);seta([0,0,z0],[0,0,lz],.011,CI);
 proj('ex',[lx+.13,0,0]);proj('ey',[0,ly+.13,0]);proj('ez',[0,0,lz+.13]);}

const fb=r=>Math.exp(-r*r);
if(K==='sino'){SC=2;ZS=.95;VMAX=1;const r0=.55;
 chaoDisco(1);gradePolar(1,4,12);tubo(anel(t=>W3(Math.cos(t),Math.sin(t),0)),.007,GEO);
 // miolo opaco: teto e^(−r²) para r ≤ r0
 sup((r,t)=>[r*Math.cos(t),r*Math.sin(t),fb(r)],0,r0,0,2*PI,22,96);
 // parede da casca (face do corte) em laranja
 sup((s,t)=>[r0*Math.cos(t),r0*Math.sin(t),s*fb(r0)],0,1,0,2*PI,2,96,(s,t)=>mixc(BG,RR,.36+.16*Math.max(0,Math.cos(t+.75))));
 tubo(anel(t=>W3(r0*Math.cos(t),r0*Math.sin(t),fb(r0))),.009,RR);tubo(anel(t=>W3(r0*Math.cos(t),r0*Math.sin(t),.002)),.009,RR);
 // fora do corte: traço (anéis e meridianos do teto, borda de cima e de baixo, geratrizes)
 for(const r of [.7,.85,1])tubo(anel(t=>W3(r*Math.cos(t),r*Math.sin(t),fb(r))),.0055,TR);
 for(let k=0;k<12;k++){const t=2*PI*k/12;tubo(Array.from({length:21},(_,s)=>{const r=r0+(1-r0)*s/20;return W3(r*Math.cos(t),r*Math.sin(t),fb(r));}),.0055,TR);
  tubo([W3(Math.cos(t),Math.sin(t),0),W3(Math.cos(t),Math.sin(t),fb(1))],.005,TR);}
 ver([7.3,-6.6,4.9],[0,.05,.55],620,600);
 eixos(2.75,2.7,2.45);
 proj('parede',[SC*r0*Math.cos(-.75),SC*r0*Math.sin(-.75),SC*ZS*fb(r0)*.5]);proj('topoParede',[SC*r0*Math.cos(-.75),SC*r0*Math.sin(-.75),SC*ZS*fb(r0)+.05]);
 proj('peParede',[SC*r0*Math.cos(-.75),SC*r0*Math.sin(-.75),0]);proj('centro',[0,0,0]);proj('pico',[0,0,SC*ZS+.08]);
 proj('borda',[SC*Math.cos(-.95),SC*Math.sin(-.95),0]);proj('rRaio',[SC*r0*.5*Math.cos(-.3),SC*r0*.5*Math.sin(-.3),0]);}

const hs=r=>Math.sqrt(Math.max(0,1-r*r));
if(K==='esfera'){SC=2;ZS=1;VMAX=1;const r0=.5;
 tubo(anel(t=>W3(Math.cos(t),Math.sin(t),0)),.006,GEO);
 sup((r,t)=>[r*Math.cos(t),r*Math.sin(t),hs(r)],0,r0,0,2*PI,16,96);
 sup((r,t)=>[r*Math.cos(t),r*Math.sin(t),-hs(r)],0,r0,0,2*PI,16,96);
 sup((s,t)=>[r0*Math.cos(t),r0*Math.sin(t),(2*s-1)*hs(r0)],0,1,0,2*PI,2,96,(s,t)=>mixc(BG,RR,.36+.16*Math.max(0,Math.cos(t+.75))));
 for(const z of [1,-1])tubo(anel(t=>W3(r0*Math.cos(t),r0*Math.sin(t),z*hs(r0))),.008,RR);
 for(const z of [-.75,-.4,.4,.75]){const r=hs(z);tubo(anel(t=>W3(r*Math.cos(t),r*Math.sin(t),z)),.0055,TR);}
 tubo(anel(t=>W3(Math.cos(t),Math.sin(t),0)),.0055,TR);
 for(let k=0;k<16;k++){const t=2*PI*k/16;tubo(Array.from({length:61},(_,s)=>{const ph=-PI/2+PI*s/60;const zz=Math.sin(ph),r=Math.cos(ph);
   return r<r0-1e-3?null:W3(r*Math.cos(t),r*Math.sin(t),zz);}).filter(Boolean),.0055,TR);}
 ver([9.4,-8.5,4.6],[0,.05,0],620,560);
 eixos(2.75,2.7,2.55,-2.4);
 proj('parede',[SC*r0*Math.cos(-.75),SC*r0*Math.sin(-.75),0]);proj('topo',[SC*r0*Math.cos(-.75),SC*r0*Math.sin(-.75),SC*hs(r0)+.05]);
 proj('base',[SC*r0*Math.cos(-.75),SC*r0*Math.sin(-.75),-SC*hs(r0)-.05]);proj('centro',[0,0,0]);proj('rRaio',[SC*r0*.5*Math.cos(-.3),SC*r0*.5*Math.sin(-.3),0]);
 proj('borda',[SC*Math.cos(-1.1),SC*Math.sin(-1.1),0]);}

if(K==='gauss'){SC=1.15;ZS=1.3;VMAX=1;const Rq=1.25,Rc=Rq*Math.SQRT2;
 const m=new T.Mesh(new T.PlaneGeometry(2*SC*Rc+.6,2*SC*Rc+.6),new T.MeshBasicMaterial({color:C('#1C1846')}));m.position.z=-.004;S.add(m);
 for(let k=-4;k<=4;k++){const a=k*.5;tubo([W3(a,-2.0,0),W3(a,2.0,0)],.004,'#3A3470');tubo([W3(-2.0,a,0),W3(2.0,a,0)],.004,'#3A3470');}
 sup((X,Y)=>[X,Y,Math.exp(-(X*X+Y*Y))],-Rq,Rq,-Rq,Rq,60,60);
 tubo([[-Rq,-Rq],[Rq,-Rq],[Rq,Rq],[-Rq,Rq],[-Rq,-Rq]].map(p=>W3(p[0],p[1],.002)),.009,GEO);
 tubo(anel(t=>W3(Rq*Math.cos(t),Rq*Math.sin(t),.003)),.011,AZC);tubo(anel(t=>W3(Rc*Math.cos(t),Rc*Math.sin(t),.003)),.011,CORAL);
 for(const s of [-1,1])tubo(Array.from({length:41},(_,i)=>{const X=-Rq+2*Rq*i/40;return W3(X,s*Rq,Math.exp(-(X*X+Rq*Rq)));}),.006,'#2A2456');
 seta([0,0,.012],[2.2,0,.012],.011,E1);seta([0,0,.012],[0,2.2,.012],.011,E2);seta([0,0,0],[0,0,2.0],.011,CI);
 ver([7.9,-7.4,5.2],[0,.1,.35],620,590);
 proj('ex',[2.33,0,0]);proj('ey',[0,2.33,0]);proj('ez',[0,0,2.13]);proj('pico',[0,0,SC*ZS+.08]);
 proj('cin',[SC*Rq*Math.cos(-2.2),SC*Rq*Math.sin(-2.2),0]);proj('ccirc',[SC*Rc*Math.cos(-1.05),SC*Rc*Math.sin(-1.05),0]);proj('quina',[SC*Rq,-SC*Rq,0]);}

if(K==='casca'){SC=2;ZS=.95;VMAX=1;const r0=.45,r1=.55,fm=fb((r0+r1)/2);
 chaoDisco(1);gradePolar(1,4,12);tubo(anel(t=>W3(Math.cos(t),Math.sin(t),0)),.007,GEO);
 // o sino inteiro fica como TRAÇO (poucos anéis + 8 meridianos), fora da casca
 for(const r of [.25,.42,.84,1])tubo(anel(t=>W3(r*Math.cos(t),r*Math.sin(t),fb(r))),.0045,TR);
 for(let k=0;k<8;k++){const t=2*PI*k/8+PI/8;
  tubo(Array.from({length:15},(_,s)=>{const r=r0*s/14;return W3(r*Math.cos(t),r*Math.sin(t),fb(r));}),.0045,TR);
  tubo(Array.from({length:15},(_,s)=>{const r=r1+(1-r1)*s/14;return W3(r*Math.cos(t),r*Math.sin(t),fb(r));}),.0045,TR);}
 // a casca fina r0 ≤ r ≤ r1, altura e^(−r²): parede de fora, parede de dentro, teto (faixa do sino)
 const sh=(s,t)=>mixc(BG,RR,.40+.18*Math.max(0,Math.cos(t+.75)));
 sup((s,t)=>[r1*Math.cos(t),r1*Math.sin(t),s*fb(r1)],0,1,0,2*PI,2,128,sh);
 sup((s,t)=>[r0*Math.cos(t),r0*Math.sin(t),s*fb(r0)],0,1,0,2*PI,2,128,(s,t)=>mixc(BG,RR,.18));
 sup((r,t)=>[r*Math.cos(t),r*Math.sin(t),fb(r)],r0,r1,0,2*PI,3,128);
 for(const r of [r0,r1]){tubo(anel(t=>W3(r*Math.cos(t),r*Math.sin(t),fb(r))),.008,RR);}
 // o anel do chão, inteiro (0 → 2π), em lima: o comprimento 2πr
 tubo(anel(t=>W3(r1*Math.cos(t),r1*Math.sin(t),.004),180),.013,LI);
 ver([7.0,-6.3,6.4],[0,.05,.45],540,560);
 eixos(2.75,2.7,2.45);
 const tf=-.75;proj('pico',[0,0,SC*ZS+.08]);proj('centro',[0,0,0]);
 proj('baseFrente',[SC*r1*Math.cos(tf-.5),SC*r1*Math.sin(tf-.5),0]);
 proj('paredeBaixo',[SC*r1*Math.cos(tf),SC*r1*Math.sin(tf),0]);proj('paredeTopo',[SC*r1*Math.cos(tf),SC*r1*Math.sin(tf),SC*ZS*fb(r1)]);
 proj('tetoDentro',[SC*r0*Math.cos(tf+.35),SC*r0*Math.sin(tf+.35),SC*ZS*fb(r0)]);proj('tetoFora',[SC*r1*Math.cos(tf+.35),SC*r1*Math.sin(tf+.35),SC*ZS*fb(r1)]);
 proj('raioPe',[SC*r1*Math.cos(.35),SC*r1*Math.sin(.35),0]);}

R.render(S,cam);window.PTS=PTS;document.title='ok';
</script></body></html>
