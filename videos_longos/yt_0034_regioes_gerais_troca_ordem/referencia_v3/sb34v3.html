 // eixo de um gráfico de uma variável com escala própria (para o sino e para a fatia)
 const G1=(X0,Y0,ux,uz)=>(a,b)=>[X0+a*ux,Y0-b*uz];
 function seta2(A,B,cor,w=3,head=16){const dx=B[0]-A[0],dy=B[1]-A[1],l=Math.hypot(dx,dy),ux=dx/l,uy=dy/l;x.strokeStyle=cor;x.fillStyle=cor;x.lineWidth=w;x.lineCap='round';
  x.beginPath();x.moveTo(...A);x.lineTo(B[0]-ux*head*.6,B[1]-uy*head*.6);x.stroke();x.beginPath();x.moveTo(B[0]+ux*2,B[1]+uy*2);x.lineTo(B[0]-ux*head-uy*head*.45,B[1]-uy*head+ux*head*.45);x.lineTo(B[0]-ux*head+uy*head*.45,B[1]-uy*head-ux*head*.45);x.closePath();x.fill();}
 function gradeG(M,a0,a1,b0,b1,pa=.25,pb=.25){x.strokeStyle='#2B2558';x.lineWidth=1.2;
  for(let a=Math.ceil(a0/pa-1e-9)*pa;a<=a1+1e-9;a+=pa){const A=M(a,b0),B=M(a,b1);x.beginPath();x.moveTo(A[0]+.5,A[1]);x.lineTo(B[0]+.5,B[1]);x.stroke();}
  for(let b=Math.ceil(b0/pb-1e-9)*pb;b<=b1+1e-9;b+=pb){const A=M(a0,b),B=M(a1,b);x.beginPath();x.moveTo(A[0],A[1]+.5);x.lineTo(B[0],B[1]+.5);x.stroke();}}
 function polyG(M,pts,fill,stroke=null,w=3){x.beginPath();pts.forEach((p,i)=>{const q=M(...p);i?x.lineTo(...q):x.moveTo(...q);});if(fill){x.closePath();x.fillStyle=fill;x.fill();}
  if(stroke){x.strokeStyle=stroke;x.lineWidth=w;x.lineJoin='round';x.lineCap='round';x.stroke();}}
 function linG(M,pts,cor,w=3,{dash=null,alpha=1}={}){x.setLineDash(dash||[]);x.globalAlpha=alpha;polyG(M,pts,null,cor,w);x.globalAlpha=1;x.setLineDash([]);}
 function dotG(M,p,cor,r=9){const q=M(...p);x.beginPath();x.arc(...q,r,0,7);x.fillStyle=cor;x.fill();}
